# @file .pre-commit-config.yaml
# @brief Library commit gate (WSP-CHECK-0001): gate start, lint, build, tests.
# @note The gate start takes the machine-wide lock shared with the WFC gate
#   (one gate at a time) and opens the test progress window. The hooks never
#   install tools or modify sources (WSP-CHECK-0007).
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: wfc-gate-start
        name: WFC gate start (single instance, progress window)
        entry: pwsh -NoProfile -File scripts/Start-CommitGate.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: lint
        name: Library lint
        entry: pwsh -NoProfile -File scripts/Invoke-Lint.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: build
        name: Library build (x64 Debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Build.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: tests
        name: Library tests (x64 Debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Tests.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
