<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfc-mscomctl2 in WebAssembly</title>
<style>
  /* The look of the WFC games and examples: navy, raised panels, teal. */
  :root { color-scheme: dark; --bg: #11141f; --panel: #1b2033; --edge: #404a6b;
    --ink: #e8ebf5; --muted: #98a0be; --accent: #3dd6c6; --amber: #ffb454; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px 48px; background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px;
    color: var(--accent); }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  p.sub b { color: var(--amber); font-weight: 600; }
  .cards { display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--edge);
    border-radius: 4px; padding: 18px 20px 16px;
    box-shadow: 3px 4px 0 #080a0f, 7px 9px 0 #0d1017; }
  .card h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .counts { color: var(--amber); font-size: 13px; font-weight: 600;
    margin-bottom: 12px; }
  code { font: 12.5px/1.6 ui-monospace, Consolas, monospace; }
  .list { color: var(--accent); }
  .more { color: var(--muted); }
  footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1 id="title">wfc-mscomctl2</h1>
  <p class="sub" id="sub">Loading the WebAssembly module...</p>
  <div class="cards" id="cards"></div>
  <footer>The class and member names come from the library's member table,
  compiled to WebAssembly with Emscripten.</footer>
</main>
<script src="mscomctl2.js"></script>
<script>
  create_mscomctl2().then((m) => {
    const text = (name, ...args) => m.UTF8ToString(m.ccall(name, 'number', args.map(() => 'number'), args));
    const num = (name, ...args) => m.ccall(name, 'number', args.map(() => 'number'), args);
    document.getElementById('title').textContent =
      text('library_name') + ' in WebAssembly';
    document.getElementById('sub').innerHTML =
      'version <b></b>, targets <b></b>';
    const bold = document.getElementById('sub').querySelectorAll('b');
    bold[0].textContent = text('library_version');
    bold[1].textContent = text('library_target');
    const cards = document.getElementById('cards');
    for (let c = 0; c < num('class_count'); c++) {
      const members = num('member_count', c), events = num('event_count', c);
      // A property has a row for reading and one for writing: list a name once.
      const names = [];
      for (let i = 0; i < members && names.length < 8; i++) {
        const name = text('member_name', c, i);
        if (!names.includes(name)) names.push(name);
      }
      const handlers = [];
      for (let i = 0; i < Math.min(events, 4); i++) handlers.push(text('event_name', c, i));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2></h2><div class="counts"></div><code class="list"></code>' +
        '<div><code class="more"></code></div>';
      card.querySelector('h2').textContent = text('class_name', c);
      card.querySelector('.counts').textContent = members + ' members, ' + events + ' events';
      card.querySelector('.list').textContent = names.join(', ') + ', ...';
      card.querySelector('.more').textContent =
        events ? 'events: ' + handlers.join(', ') + (events > 4 ? ', ...' : '') : '';
      cards.appendChild(card);
    }
    const ready = document.createElement('span');
    ready.id = 'ready';
    ready.hidden = true;
    document.body.appendChild(ready);
  });
</script>
</body>
</html>
